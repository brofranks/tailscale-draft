name: Addressing Tailcat diagnostics

on:
  push:
    branches: [rehearsal-tailcat]

permissions:
  contents: read

jobs:
  ssh:
    if: github.repository == 'brofranks/tailscale-draft'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Generate integrated source
        env:
          GIT_COMMITTER_NAME: Rehearsal
          GIT_COMMITTER_EMAIL: rehearsal@localhost
        run: scripts/generate
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install Tailcat
        env:
          GOBIN: ${{ runner.temp }}
        run: go install github.com/tailscale/tailcat/cmd/tailcat@52fbad323e9d352f1febb623e0975368e9a8cbdd
      - name: Generate server identity
        run: |
          "$RUNNER_TEMP/tailcat" genkey --fixed-region \
            --key="$RUNNER_TEMP/server.private.json" > "$RUNNER_TEMP/tailcat-address.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tailcat-address
          path: ${{ runner.temp }}/tailcat-address.txt
          retention-days: 1
          if-no-files-found: error
      - name: Serve authenticated SSH to the allowed client
        run: |
          "$RUNNER_TEMP/tailcat" serve --key="$RUNNER_TEMP/server.private.json" \
            --allow=nodekey:5426074452a3689ff4a934da7452eb742d953a890189f13503fe507e0cb64b49 \
            --ssh-authorized-keys='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHXMRFN6/PHQYW4jv43vODlv0DWbdsyFbRwFyBkbAes/ coder@53e99ea32494' ssh &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          timeout 600 bash -c 'until test -f "$HOME/addressing-complete"; do sleep 2; done'
